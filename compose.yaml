services:
  lake:
    build: ./docker
    image: retail-lake:tp2
    hostname: lake
    ports:
      - "127.0.0.1:9870:9870"
      - "127.0.0.1:9864:9864"
      - "127.0.0.1:8443:8443"
    volumes:
      - hadoop-data:/home/etudiant/hadoop-data
      - nifi:/opt/nifi
      - ./retail_project:/data/retail_project:ro
    security_opt:
      - label=disable
    stop_grace_period: 60s

volumes:
  hadoop-data:
  nifi:
